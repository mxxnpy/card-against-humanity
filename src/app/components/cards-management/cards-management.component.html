<div class="page-container">
  <div class="page-header">
    <button class="back-btn" routerLink="/home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Voltar
    </button>
    <h1 class="page-title">Gerenciar Cartas</h1>
    <button class="create-btn" (click)="openCreateModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nova Carta
    </button>
  </div>

  <!-- Filtros -->
  <div class="filters">
    <button class="filter-btn" [class.active]="filterType === 'all'" (click)="filterType = 'all'">
      Todas
    </button>
    <button class="filter-btn" [class.active]="filterType === 1" (click)="filterType = 1">
      Perguntas (Pretas)
    </button>
    <button class="filter-btn" [class.active]="filterType === 2" (click)="filterType = 2">
      Respostas (Brancas)
    </button>
  </div>

  <!-- Grid de Cartas -->
  <div class="cards-grid">
    <div class="game-card" [class.is-black]="card.cardType === 1" *ngFor="let card of filteredCards">
      <div class="card-content">
        <div class="card-type-badge">{{ card.cardType === 1 ? 'Pergunta' : 'Resposta' }}</div>
        <p class="card-text">{{ card.text }}</p>
      </div>
      <div class="card-actions">
        <button class="card-action-btn" (click)="editCard(card)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
        <button class="card-action-btn danger" (click)="deleteCard(card.cardId)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Criar/Editar -->
  <div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ editingCard ? 'Editar Carta' : 'Nova Carta' }}</h2>
        <button class="close-modal-btn" (click)="closeModal()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Tipo de Carta</label>
          <select [(ngModel)]="cardForm.cardType" class="form-select">
            <option [value]="1">Pergunta (Preta)</option>
            <option [value]="2">Resposta (Branca)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Texto da Carta</label>
          <textarea [(ngModel)]="cardForm.text" class="form-textarea" rows="4" placeholder="Digite o texto da carta..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn cancel" (click)="closeModal()">Cancelar</button>
        <button class="modal-btn save" (click)="saveCard()">{{ editingCard ? 'Salvar' : 'Criar' }}</button>
      </div>
    </div>
  </div>
</div>
